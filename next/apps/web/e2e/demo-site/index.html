<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abebe Furniture (demo)</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        color: #1b1c21;
        background: #faf9f6;
      }
      header,
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e4e1da;
        border-radius: 12px;
        padding: 16px;
        margin: 12px 0;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 8px;
        border: 0;
        background: #2d4bd8;
        color: #fff;
        cursor: pointer;
      }
      .fake {
        background: #c2381e;
      }
      .spacer {
        height: 1400px;
      }
    </style>
    <!-- Tracking snippet: key (k) and collector (c) come from the query string so tests can point it anywhere. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var key = q.get('k') || sessionStorage.getItem('demo_k');
        var col = q.get('c') || sessionStorage.getItem('demo_c') || 'http://localhost:4200';
        if (!key) return;
        sessionStorage.setItem('demo_k', key);
        sessionStorage.setItem('demo_c', col);
        var s = document.createElement('script');
        s.async = true;
        s.src = col + '/sdk/p.js';
        s.setAttribute('data-site', key);
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <header>
      <h1>Abebe Furniture</h1>
      <a href="/checkout.html">Checkout →</a>
    </header>
    <main>
      <div class="card">
        <h2>Sofa</h2>
        <p>12,400 ብር</p>
        <button id="add" onclick="this.textContent = 'Added ✓'">Add to cart</button>
      </div>
      <div class="card">
        <h2>Pay with telebirr</h2>
        <p>This button looks clickable but does nothing (a "dead click").</p>
        <button id="dead" class="fake" role="button">Pay with telebirr</button>
      </div>
      <div class="spacer"></div>
      <p id="bottom">Bottom of page</p>
    </main>
  </body>
</html>
